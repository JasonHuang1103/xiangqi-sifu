[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-sifu"
version = "0.1.0"
description = "Local-first Xiangqi analysis, coaching, and play."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "numpy>=1.26", "Pillow>=10"]
app = [
    "fastapi>=0.116,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]
frontend = ["streamlit>=1.30"]
vision = ["numpy>=1.26", "Pillow>=10"]
training = [
    "accelerate>=1.5",
    "datasets>=3.4",
    "peft>=0.15",
    "tensorboard>=2.19",
    "torch>=2.5",
    "transformers>=4.50",
]

[project.scripts]
xiangqi-sifu = "xiangqi_sifu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
