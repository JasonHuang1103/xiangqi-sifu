[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-sifu"
version = "0.1.0"
description = "Phase 1 MVP for personal Xiangqi game review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
frontend = ["streamlit>=1.30"]
training = [
    "accelerate>=1.5",
    "datasets>=3.4",
    "peft>=0.15",
    "tensorboard>=2.19",
    "torch>=2.5",
    "transformers>=4.50",
]

[project.scripts]
xiangqi-sifu = "xiangqi_sifu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
